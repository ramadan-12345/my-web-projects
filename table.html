<!DOCTYPE html>
<html>
<link rel="stylesheet" href="javascript">

<head>
  <style>
    body {
      background-color: #E7B75F;
    }

    .slider {
      width: 100%;
      overflow: hidden;
    }

    .slides {
      display: flex;
      gap: 15px;
      transition: transform 0.6s ease;
    }

    .card {
      min-width: 70%;
      height: 500px;
      position: relative;
      overflow: hidden;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .text {
      position: absolute;
      bottom: 30px;
      left: 30px;
      right: 30px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .text h2 {
      color: white;
    }

    .text button {
      border: none;
      border-radius: 30px;
      padding: 15px 25px;
      background: white;
      cursor: pointer;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 15px;
    }

    .dot {
      width: 10px;
      height: 10px;
      background: #888;
      border-radius: 50%;
    }

    .dot.active {
      width: 30px;
      border-radius: 10px;
      background: black;
    }
  </style>
</head>

<body>
  <div class="slider">
    <div class="slides">

      <div class="card">
        <img src="18.jpg" alt="">
        <div class="text">
          <h2>HIIT with Bakari</h2>
          <button>Watch now</button>
        </div>
      </div>

      <div class="card">
        <img src="mac.jpg" alt="">
        <div class="text">
          <h2>New Music Daily</h2>
          <button>Listen now</button>
        </div>
      </div>

      <div class="card">
        <img src="card.jpg" alt="">
        <div class="text">
          <h2>Balatro+</h2>
          <button>Play now</button>
        </div>
      </div>

      <div class="card">
        <img src="image4.jpg" alt="">
        <div class="text">
          <h2>Apple TV+</h2>
          <button>Stream now</button>
        </div>
      </div>

    </div>
  </div>

  <div class="dots">
    <span class="dot active"></span>
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>
</body>

</html>
